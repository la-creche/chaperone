[package]
name = "chaperone"
description = "The chaperone program: it loads the configuration, hosts the plugins and audits every call"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chaperone-core = { path = "../core" }
chaperone-plugin-audit-jsonl = { path = "../../plugins/default/audit-jsonl" }
chaperone-plugin-bearer = { path = "../../plugins/default/bearer" }
chaperone-plugin-mcp-http = { path = "../../plugins/default/mcp-http" }
chaperone-plugin-system-clock = { path = "../../plugins/default/system-clock" }
clap = { workspace = true }
getrandom = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
rmcp = { workspace = true, features = ["client", "reqwest", "transport-streamable-http-client-reqwest"] }
sha2 = { workspace = true }
tempfile = { workspace = true }
