[package]
name = "chaperone"
description = "The chaperone program: it loads the configuration, hosts the plugins and audits every call"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { workspace = true, features = ["json"] }
chaperone-core = { path = "../core" }
chaperone-plugin-attendance-fence = { path = "../../plugins/decision/included/attendance" }
chaperone-plugin-audit-jsonl = { path = "../../plugins/default/audit-jsonl" }
chaperone-plugin-bearer = { path = "../../plugins/default/bearer" }
chaperone-plugin-ha-call-fence = { path = "../../plugins/decision/included/ha-call" }
chaperone-plugin-mcp-http = { path = "../../plugins/default/mcp-http" }
chaperone-plugin-secret-files = { path = "../../plugins/default/secret-files" }
chaperone-plugin-system-clock = { path = "../../plugins/default/system-clock" }
clap = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true, features = ["codec"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "reqwest", "server", "transport-io", "transport-streamable-http-client-reqwest"] }
tempfile = { workspace = true }

[[test]]
name = "fake_upstream"
harness = false
