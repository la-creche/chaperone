[package]
name = "chaperone-editor"
description = "The policy editor: HTML forms over policy.json, checked by the chaperone admin socket"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "chaperone-editor"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["form", "query"] }
base64 = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "signal"] }
tokio-util = { workspace = true }

[dev-dependencies]
axum = { workspace = true, features = ["json"] }
reqwest = { workspace = true, features = ["form"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["process"] }
