[package]
name = "chaperone-plugin-attendance"
description = "The effect half of attendance: invoke_agent, enqueue and job_status through the doors of the session service"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "chaperone-attendance"
path = "src/main.rs"

[dependencies]
chaperone-ulid = { path = "../../../../crates/ulid" }
clap = { workspace = true }
reqwest = { workspace = true }
rmcp = { workspace = true, features = ["server", "transport-async-rw"] }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true, features = ["parsing"] }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread"] }

[dev-dependencies]
axum = { workspace = true, features = ["json"] }
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["process", "sync"] }
