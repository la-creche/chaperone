[package]
name = "chaperone-plugin-ha-approval"
description = "The approval channel through the operator's Node-RED and Home Assistant flow"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "chaperone-ha-approval"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["json"] }
clap = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
rmcp = { workspace = true, features = ["server", "transport-async-rw"] }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }
tokio = { workspace = true, features = ["process"] }
