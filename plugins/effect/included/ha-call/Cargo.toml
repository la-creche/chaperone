[package]
name = "chaperone-plugin-ha-call"
description = "The effect half of ha-call: one Home Assistant service call"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "chaperone-ha-call"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
reqwest = { workspace = true }
rmcp = { workspace = true, features = ["server", "transport-async-rw"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread", "time"] }

[dev-dependencies]
axum = { workspace = true, features = ["json"] }
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }
tokio = { workspace = true, features = ["process", "sync"] }
