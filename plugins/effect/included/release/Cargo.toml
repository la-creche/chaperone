[package]
name = "chaperone-plugin-release"
description = "The release upstream: one request file in the release spool per call"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "chaperone-release"
path = "src/main.rs"

[dependencies]
chaperone-ulid = { path = "../../../../crates/ulid" }
clap = { workspace = true }
getrandom = { workspace = true }
rmcp = { workspace = true, features = ["server", "transport-async-rw"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-std", "macros", "rt-multi-thread"] }

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["process"] }
