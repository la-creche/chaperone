[package]
name = "chaperone-plugin-deny-all"
description = "The default approval channel: it denies every gate"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "chaperone-deny-all"
path = "src/main.rs"

[dependencies]
rmcp = { workspace = true, features = ["server", "transport-io"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std", "macros", "rt"] }

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }
tokio = { workspace = true, features = ["process", "rt-multi-thread"] }
