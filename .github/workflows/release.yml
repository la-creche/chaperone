# Release on merge (docs/design.md section 12): plan, build, sign, release.
# A version of crates/chaperone/Cargo.toml with a tag, or no version, ends
# the run green with nothing to do. Only `sign` holds the identity token,
# and it runs no code of the repository. Only `release` can write: it
# makes the tag at the merge commit and the Release. GITHUB_TOKEN makes
# `github-actions[bot]` the author. Each signature writes one public record
# to the Sigstore transparency log. A tag is never moved. A tag with no
# Release is finished by "Re-run failed jobs" of the same run.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

# One release at a time, and none stopped half way.
concurrency:
  group: release
  cancel-in-progress: false

env:
  TARGET: x86_64-unknown-linux-musl
  ARCHIVE: chaperone-x86_64-unknown-linux-musl.tar.gz

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          version="$(python3 -c '
          import tomllib
          with open("crates/chaperone/Cargo.toml", "rb") as file:
              value = tomllib.load(file)["package"].get("version")
          print(value if isinstance(value, str) else "")
          ')"
          if [[ -z "$version" ]]; then
            echo "crates/chaperone/Cargo.toml sets no version: nothing to release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the version $version is not x.y.z"
            exit 1
          fi
          tag="chaperone-v$version"
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null || status=$?
          if [[ "$status" -eq 0 ]]; then
            echo "The tag $tag exists: nothing to release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$status" -ne 2 ]]; then
            echo "::error::git ls-remote failed with the status $status"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.pack.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each program goes to `$CARGO_INSTALL_ROOT/bin/<name>`, the rule of a
      # binary build of the host's release tool. The programs are chaperone,
      # its helper chaperone-as and the program of each `plugin.toml`, in
      # name order. `serve` finds a plugin program next to chaperone, and it
      # refuses to start when a plugin of `install.toml` does not launch.
      # `--bin` names each program, so another binary of a package, such as
      # a test fake, stays out of the install root. The remap keeps the
      # paths of the runner out of each program.
      - name: Build
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          export CARGO_INSTALL_ROOT="$RUNNER_TEMP/work/chaperone"
          export CARGO_BUILD_TARGET="$TARGET"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/target"
          export CARGO_INCREMENTAL=0
          RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/build/workspace"
          RUSTFLAGS+=" --remap-path-prefix=$cargo_home=/build/cargo-home"
          RUSTFLAGS+=" --remap-path-prefix=$RUNNER_TEMP=/build/temp"
          export RUSTFLAGS
          cargo install --locked --no-track --path crates/chaperone --bin chaperone
          cargo install --locked --no-track --path crates/run-as --bin chaperone-as
          cargo install --locked --no-track --path plugins/effect/included/attendance --bin chaperone-attendance
          cargo install --locked --no-track --path plugins/default/deny-all --bin chaperone-deny-all
          cargo install --locked --no-track --path plugins/effect/included/ha-approval --bin chaperone-ha-approval
          cargo install --locked --no-track --path plugins/effect/included/ha-call --bin chaperone-ha-call
          cargo install --locked --no-track --path plugins/effect/included/release --bin chaperone-release

      # The archive holds one regular file per program of the build, mode
      # 0755, as `chaperone/bin/<name>` in name order, and no directory
      # member. The host's release tool refuses each other member. The same
      # tree gives the same bytes.
      - name: Check and pack
        id: pack
        run: |
          set -euo pipefail
          export LC_ALL=C
          work="$RUNNER_TEMP/work"
          out="$RUNNER_TEMP/out"
          members=(
            chaperone/bin/chaperone
            chaperone/bin/chaperone-as
            chaperone/bin/chaperone-attendance
            chaperone/bin/chaperone-deny-all
            chaperone/bin/chaperone-ha-approval
            chaperone/bin/chaperone-ha-call
            chaperone/bin/chaperone-release
          )
          expected="$(printf '%s\n' chaperone chaperone/bin "${members[@]}")"
          if [[ "$(cd "$work" && find . -mindepth 1 | sed 's|^\./||' | sort)" != "$expected" ]]; then
            echo "::error::the install tree holds another file than the programs of the build"
            exit 1
          fi
          for member in "${members[@]}"; do
            if [[ -L "$work/$member" || ! -f "$work/$member" || ! -x "$work/$member" ]]; then
              echo "::error::$member is no program"
              exit 1
            fi
          done
          if grep -rqF -e "$GITHUB_WORKSPACE" -e "${CARGO_HOME:-$HOME/.cargo}" -e "$RUNNER_TEMP" "$work"; then
            echo "::error::a program holds a path of the runner"
            exit 1
          fi
          mkdir "$out"
          tar --create --file - --directory "$work" \
            --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 --mode=0755 \
            -- "${members[@]}" | gzip --no-name > "$out/$ARCHIVE"
          if [[ "$(tar --list --gzip --file "$out/$ARCHIVE")" != "$(printf '%s\n' "${members[@]}")" ]]; then
            echo "::error::the archive holds other members"
            exit 1
          fi
          digest="$(cd "$out" && sha256sum "$ARCHIVE")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo '```'
            tar --list --verbose --gzip --file "$out/$ARCHIVE"
            echo "$digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive
          path: ${{ runner.temp }}/out/${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: archive
          path: ${{ runner.temp }}/assets

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Sign only the bytes that the build job packed.
      - name: Sign
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/assets"
          if [[ "$(ls -A)" != "$ARCHIVE" || "${DIGEST:66}" != "$ARCHIVE" ]]; then
            echo "::error::the job artifact is not the one archive of the build job"
            exit 1
          fi
          sha256sum --check --strict <<< "$DIGEST"
          cosign sign-blob --yes --bundle "$ARCHIVE.sigstore.json" "$ARCHIVE" < /dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle
          path: ${{ runner.temp }}/assets/${{ env.ARCHIVE }}.sigstore.json
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [plan, build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the tag and the Release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: archive
          path: ${{ runner.temp }}/assets

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle
          path: ${{ runner.temp }}/assets

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # The words of the host's check of the signature.
      - name: Check the signature
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/assets"
          sha256sum --check --strict <<< "$DIGEST"
          cosign verify-blob --bundle "$ARCHIVE.sigstore.json" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main" \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref refs/heads/main \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            "$ARCHIVE" < /dev/null

      # A lightweight tag at the merge commit. A tag on another commit
      # stops the run.
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/assets"
          found="$(git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$TAG" | cut -f 1)"
          if [[ -z "$found" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" > /dev/null
          elif [[ "$found" != "$GITHUB_SHA" ]]; then
            echo "::error::$TAG exists on $found, not on $GITHUB_SHA. A tag is never moved."
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes "chaperone, built from $GITHUB_SHA." \
            "$ARCHIVE" "$ARCHIVE.sigstore.json"
          echo "Released $TAG on $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
