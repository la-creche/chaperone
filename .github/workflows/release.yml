# Release on merge (docs/design.md section 12): gate, plan, build, sign,
# release, as creche's release.yml mints its tags (creche contract 06 §2):
# NO VERSION LIVES IN A FILE. The tag is the version, and the build stamps it.
#
#   gate ──────────────────────────────┐
#   plan ── build ── sign ── release ──┘   release needs all four
#
# `plan` asks creche's allocator (handover/bin/allocate-tags.sh, at the
# pinned CRECHE_REF) for the next `chaperone-vX.Y.Z`: the newest tag plus a
# patch, or the level of a `bump:minor` / `bump:major` label on the merged
# pull request. A merge that changed no chaperone path, or a commit already
# tagged, plans nothing, and the run ends green. `build` writes that version
# into the working tree's Cargo.toml and Cargo.lock, never into git, so
# `chaperone --version` names the tag. `release` runs the same allocator for
# real, with the archive and its bundle: it checks the signature with the
# words the host uses, then makes the tag at the merge commit and the
# Release. It refuses a tag other than the planned one.
#
# Only `sign` holds the identity token, and it runs no code of the
# repository. Only `release` can write. GITHUB_TOKEN makes
# `github-actions[bot]` the author. Each signature writes one public record
# to the Sigstore transparency log. A tag is never moved. A red run tags
# nothing, and the next green run covers its changes: the allocator measures
# from chaperone's own newest tag. `workflow_dispatch` starts the same run by
# hand, for a commit a missed run left behind.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, and none stopped half way.
concurrency:
  group: release
  cancel-in-progress: false

env:
  TARGET: x86_64-unknown-linux-musl
  ARCHIVE: chaperone-x86_64-unknown-linux-musl.tar.gz
  # The COMMIT of la-creche/creche whose allocator this run borrows, as
  # mcp's and registry's tag workflows borrow it. Raise it deliberately, and
  # only to a commit on creche's `main`. The check in `plan` refuses one that
  # cannot scope a run to one repository.
  CRECHE_REF: a4b8ba2e84bf1670dce2b0c3bae4bf88c8c0fd5c

jobs:
  # ci.yml's gate, on the merged commit. Diff the two when changing either.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the merge SHA -> PR lookup, for the bump label
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every tag and the history: the newest chaperone-v* tag is the
          # base of both the level and the range.
          fetch-depth: 0

      # The product is public, so the checkout needs no token of its own.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: la-creche/creche
          ref: ${{ env.CRECHE_REF }}
          path: .creche
          persist-credentials: false

      - name: Check the pin can scope a run to one repository
        run: |
          set -euo pipefail
          script=.creche/handover/bin/allocate-tags.sh
          if ! grep -q 'TAG_REPO_ROOT' "$script" || ! grep -q 'TAG_REPO:-' "$script"; then
            echo "::error::CRECHE_REF $CRECHE_REF cannot scope a run to one repository; raise it to a commit on creche's main that carries TAG_REPO_ROOT and TAG_REPO."
            exit 1
          fi

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # The dry run needs no write scope. Its one `would create` line names
      # the next tag; no such line means nothing to release.
      - name: Plan the tag
        id: plan
        working-directory: .creche
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_REPO_ROOT: ${{ github.workspace }}
          TAG_REPO: chaperone
        run: |
          set -euo pipefail
          handover/bin/allocate-tags.sh --dry-run | tee "$RUNNER_TEMP/plan"
          tag="$(sed -n 's/^would create \(chaperone-v[0-9][0-9.]*\) on .*/\1/p' "$RUNNER_TEMP/plan")"
          if [[ -z "$tag" ]]; then
            echo "No new chaperone tag on $GITHUB_SHA: nothing to release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version="${tag#chaperone-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$tag" == *$'\n'* ]]; then
            echo "::error::the plan named no single x.y.z tag: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.pack.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag is the version. It goes into the working tree only, so
      # `chaperone --version` names the tag and git never holds a number.
      - name: Stamp the version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          version = os.environ["VERSION"]
          for path, pattern in (
              ("crates/chaperone/Cargo.toml", r'(?m)^(version = )"0\.0\.0"$'),
              ("Cargo.lock", r'(name = "chaperone"\nversion = )"0\.0\.0"'),
          ):
              with open(path, encoding="utf-8") as file:
                  text = file.read()
              stamped, count = re.subn(pattern, rf'\g<1>"{version}"', text, count=1)
              if count != 1:
                  raise SystemExit(f"{path} holds no chaperone version 0.0.0 to stamp")
              with open(path, "w", encoding="utf-8") as file:
                  file.write(stamped)
          PY

      # Each program goes to `$CARGO_INSTALL_ROOT/bin/<name>`, the rule of a
      # binary build of the host's release tool. The programs are chaperone,
      # its helper chaperone-as and the program of each `plugin.toml`, in
      # name order. `serve` finds a plugin program next to chaperone, and it
      # refuses to start when a plugin of `install.toml` does not launch.
      # `--bin` names each program, so another binary of a package, such as
      # a test fake, stays out of the install root. The remap keeps the
      # paths of the runner out of each program.
      - name: Build
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          export CARGO_INSTALL_ROOT="$RUNNER_TEMP/work/chaperone"
          export CARGO_BUILD_TARGET="$TARGET"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/target"
          export CARGO_INCREMENTAL=0
          RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/build/workspace"
          RUSTFLAGS+=" --remap-path-prefix=$cargo_home=/build/cargo-home"
          RUSTFLAGS+=" --remap-path-prefix=$RUNNER_TEMP=/build/temp"
          export RUSTFLAGS
          cargo install --locked --no-track --path crates/chaperone --bin chaperone
          cargo install --locked --no-track --path crates/run-as --bin chaperone-as
          cargo install --locked --no-track --path plugins/effect/included/attendance --bin chaperone-attendance
          cargo install --locked --no-track --path plugins/default/deny-all --bin chaperone-deny-all
          cargo install --locked --no-track --path plugins/effect/included/ha-approval --bin chaperone-ha-approval
          cargo install --locked --no-track --path plugins/effect/included/ha-call --bin chaperone-ha-call
          cargo install --locked --no-track --path plugins/effect/included/release --bin chaperone-release

      # The archive holds one regular file per program of the build, mode
      # 0755, as `chaperone/bin/<name>` in name order, and no directory
      # member. The host's release tool refuses each other member. The same
      # tree gives the same bytes.
      - name: Check and pack
        id: pack
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          work="$RUNNER_TEMP/work"
          out="$RUNNER_TEMP/out"
          members=(
            chaperone/bin/chaperone
            chaperone/bin/chaperone-as
            chaperone/bin/chaperone-attendance
            chaperone/bin/chaperone-deny-all
            chaperone/bin/chaperone-ha-approval
            chaperone/bin/chaperone-ha-call
            chaperone/bin/chaperone-release
          )
          expected="$(printf '%s\n' chaperone chaperone/bin "${members[@]}")"
          if [[ "$(cd "$work" && find . -mindepth 1 | sed 's|^\./||' | sort)" != "$expected" ]]; then
            echo "::error::the install tree holds another file than the programs of the build"
            exit 1
          fi
          for member in "${members[@]}"; do
            if [[ -L "$work/$member" || ! -f "$work/$member" || ! -x "$work/$member" ]]; then
              echo "::error::$member is no program"
              exit 1
            fi
          done
          if [[ "$("$work/chaperone/bin/chaperone" --version)" != "chaperone $VERSION" ]]; then
            echo "::error::chaperone --version does not name $VERSION"
            exit 1
          fi
          if grep -rqF -e "$GITHUB_WORKSPACE" -e "${CARGO_HOME:-$HOME/.cargo}" -e "$RUNNER_TEMP" "$work"; then
            echo "::error::a program holds a path of the runner"
            exit 1
          fi
          mkdir "$out"
          tar --create --file - --directory "$work" \
            --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 --mode=0755 \
            -- "${members[@]}" | gzip --no-name > "$out/$ARCHIVE"
          if [[ "$(tar --list --gzip --file "$out/$ARCHIVE")" != "$(printf '%s\n' "${members[@]}")" ]]; then
            echo "::error::the archive holds other members"
            exit 1
          fi
          digest="$(cd "$out" && sha256sum "$ARCHIVE")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo '```'
            tar --list --verbose --gzip --file "$out/$ARCHIVE"
            echo "$digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive
          path: ${{ runner.temp }}/out/${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: archive
          path: ${{ runner.temp }}/assets

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Sign only the bytes that the build job packed.
      - name: Sign
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/assets"
          if [[ "$(ls -A)" != "$ARCHIVE" || "${DIGEST:66}" != "$ARCHIVE" ]]; then
            echo "::error::the job artifact is not the one archive of the build job"
            exit 1
          fi
          sha256sum --check --strict <<< "$DIGEST"
          cosign sign-blob --yes --bundle "$ARCHIVE.sigstore.json" "$ARCHIVE" < /dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle
          path: ${{ runner.temp }}/assets/${{ env.ARCHIVE }}.sigstore.json
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [gate, plan, build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the tag and the Release
      pull-requests: read # the merge SHA -> PR lookup, for the bump label
    steps:
      # The allocator tags this checkout and pushes the tag, so it keeps the
      # job's credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: la-creche/creche
          ref: ${{ env.CRECHE_REF }}
          path: .creche
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: archive
          path: ${{ runner.temp }}/assets

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle
          path: ${{ runner.temp }}/assets

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # Only the bytes that the build job packed.
      - name: Check the digest
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/assets"
          sha256sum --check --strict <<< "$DIGEST"

      # The allocator checks the signature with the words the host uses
      # (`handover artifacts --verify-words`), then makes the tag at the
      # merge commit and the Release with both files. It never moves a tag.
      - name: Tag and publish
        working-directory: .creche
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_REPO_ROOT: ${{ github.workspace }}
          TAG_REPO: chaperone
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          export ASSET_DIR="$RUNNER_TEMP/assets"
          COSIGN="$(command -v cosign)"
          export COSIGN
          handover/bin/allocate-tags.sh | tee "$RUNNER_TEMP/release"
          if ! grep -q "^released $TAG on $GITHUB_SHA" "$RUNNER_TEMP/release"; then
            echo "::error::the allocator did not release the planned $TAG"
            exit 1
          fi
          echo "Released $TAG on $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
